# Nhịp chiến dịch nối lại đại lý — Partner Hub.
#
# 🔴 BÀI HỌC 27/07 (đo bằng số thật, đừng làm lại):
#  1. GitHub Actions KHÔNG chạy đúng lịch dày. `reminder-tick` khai `*/5` nhưng các lần chạy
#     thật cách nhau 52–219 phút.
#  2. GitHub còn chạy TRỄ 2–3 TIẾNG so với mốc khai báo. Mốc 10:07 UTC thực tế nổ lúc 12:35 UTC.
#     ⇒ Khung gửi hẹp (9–11h30 + 14–17h30 VN) làm MỌI nhịp rơi ra ngoài khung → cả ngày 0 tin.
#     Đã nới khung gửi thành một dải liền 8h–18h VN để nhịp trễ vẫn còn chỗ đáp.
#  3. Vercel Cron KHÔNG thay thế được: gói Hobby chỉ cho lịch 1 lần/ngày (đã thử, bị từ chối).
#
# ⇒ Rải NHIỀU mốc cố định trong dải 1:00–11:00 UTC (= 8h–18h VN). Mỗi nhịp gửi CỤM tối đa 6 tin.
#   Nổ trễ vài tiếng vẫn còn nằm trong khung. Phút lẻ để né lúc GitHub đông nhất là đầu giờ tròn.
#
# Repo này KHÔNG chứa code/secret app; chỉ gọi endpoint với PARTNER_REMINDERS_KEY (Actions Secrets).
name: partner-hub-campaign
on:
  schedule:
    - cron: "8 1 * * 1-6"
    - cron: "38 1 * * 1-6"
    - cron: "8 2 * * 1-6"
    - cron: "38 2 * * 1-6"
    - cron: "8 3 * * 1-6"
    - cron: "38 3 * * 1-6"
    - cron: "8 4 * * 1-6"
    - cron: "38 4 * * 1-6"
    - cron: "8 5 * * 1-6"
    - cron: "38 5 * * 1-6"
    - cron: "8 6 * * 1-6"
    - cron: "38 6 * * 1-6"
    - cron: "8 7 * * 1-6"
    - cron: "38 7 * * 1-6"
    - cron: "8 8 * * 1-6"
    - cron: "38 8 * * 1-6"
    - cron: "8 9 * * 1-6"
    - cron: "38 9 * * 1-6"
    - cron: "8 10 * * 1-6"
    - cron: "38 10 * * 1-6"
    # 18h05 VN = 11:05 UTC — bản tin tổng kết chiều
    - cron: "5 11 * * 1-6"
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Nhịp gửi (hoặc bản tin chiều)
        run: |
          # Nhánh 18h05 → gửi bản tin tổng kết; còn lại → 1 cụm tin.
          if [ "${{ github.event.schedule }}" = "5 11 * * 1-6" ]; then Q="?report=1"; else Q=""; fi
          curl -fsS --max-time 120 -X GET \
            -H "x-worker-key: ${{ secrets.PARTNER_REMINDERS_KEY }}" \
            "https://partner-hub.mehappy.click/api/campaign/tick$Q" \
            -w "\nHTTP %{http_code}\n"
